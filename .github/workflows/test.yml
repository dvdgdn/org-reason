name: tests
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Emacs ${{ matrix.emacs }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs: ['30.1']
        python: ['3.12']
        include:
          # The oldest supported Emacs, and the Python macOS ships (newer
          # Ubuntu images no longer offer 3.9).
          - os: ubuntu-22.04
            emacs: '29.4'
            python: '3.9'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Vendored Reason Commons files match their pinned hashes
        run: python -I scripts/check_vendor.py
      - name: Python tests
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Emacs tests
        env:
          ORG_REASON_TEST_PYTHON: python
        run: emacs -Q --batch -L . -l test/org-reason-tests.el -f ert-run-tests-batch-and-exit
      - name: Byte-compile without warnings
        run: emacs -Q --batch -L . --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile org-reason*.el
